<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DRUMPAD</title>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="stylesheet" href="style.css" />
    <script src="main.JS" defer></script>
  </head>

  <body>
    <h1>DRUM PAD</h1>
    <div class="pad">
      <div data-key="A" class="key">
        <kbd>A</kbd><span class="sound">CLAP</span>
      </div>

      <div data-key="Z" class="key">
        <kbd>Z</kbd><span class="sound">HIHAT</span>
      </div>

      <div data-key="E" class="key">
        <kbd>E</kbd><span class="sound">KICK</span>
      </div>

      <div data-key="Q" class="key">
        <kbd>Q</kbd><span class="sound">OPENHAT</span>
      </div>

      <div data-key="S" class="key">
        <kbd>S</kbd><span class="sound">BOOM</span>
      </div>

      <div data-key="D" class="key">
        <kbd>D</kbd><span class="sound">RIDE</span>
      </div>

      <div data-key="W" class="key">
        <kbd>W</kbd><span class="sound">SNARE</span>
      </div>

      <div data-key="X" class="key">
        <kbd>X</kbd><span class="sound">TOM</span>
      </div>
      <div data-key="C" class="key">
        <kbd>C</kbd><span class="sound">TINK</span>
      </div>

      <div class="boutons-enregistrement">
        <button data-key="R" class="rec-button key" type="button">REC</button>
        <button data-key="P" class="play-button key" type="button">PLAY</button>
      </div>
    </div>

    <!-- Audio source -->
    <audio
      data-key="A"
      src="https://s3-us-west-2.amazonaws.com/s.cdpn.io/1159990/clap.wav"
    ></audio>
    <audio
      data-key="Z"
      src="https://s3-us-west-2.amazonaws.com/s.cdpn.io/1159990/hihat.wav"
    ></audio>
    <audio
      data-key="E"
      src="https://s3-us-west-2.amazonaws.com/s.cdpn.io/1159990/kick.wav"
    ></audio>
    <audio
      data-key="Q"
      src="https://s3-us-west-2.amazonaws.com/s.cdpn.io/1159990/openhat.wav"
    ></audio>
    <audio
      data-key="S"
      src="https://s3-us-west-2.amazonaws.com/s.cdpn.io/1159990/boom.wav"
    ></audio>
    <audio
      data-key="D"
      src="https://s3-us-west-2.amazonaws.com/s.cdpn.io/1159990/ride.wav"
    ></audio>
    <audio
      data-key="W"
      src="https://s3-us-west-2.amazonaws.com/s.cdpn.io/1159990/snare.wav"
    ></audio>
    <audio
      data-key="X"
      src="https://s3-us-west-2.amazonaws.com/s.cdpn.io/1159990/tom.wav"
    ></audio>
    <audio
      data-key="C"
      src="https://s3-us-west-2.amazonaws.com/s.cdpn.io/1159990/tink.wav"
    ></audio>
  </body>
</html>
